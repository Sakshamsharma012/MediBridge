version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: medibridge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medibridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medibridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medibridge-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/medibridge?schema=public
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=medibridge_super_secret_jwt_key_2026_change_in_production
      - JWT_REFRESH_SECRET=medibridge_super_secret_refresh_key_2026
      - ML_SERVICE_URL=http://ml-service:8000
      - DEMO_MODE=true
    depends_on:
      postgres:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: medibridge-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medibridge-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
